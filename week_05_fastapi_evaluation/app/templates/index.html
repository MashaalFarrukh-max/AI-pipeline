
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f1fb;
            color: #29243b;
        }

        .container {
            max-width: 850px;
            margin: 70px auto;
            padding: 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #6545a5;
            font-size: 34px;
        }

        .header p {
            color: #777;
        }

        .chat-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.06);
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            outline-color: #8061bb;
        }

        button {
            margin-top: 15px;
            padding: 13px 25px;
            background: #7653b5;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #604197;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .answer-box {
            display: none;
            margin-top: 25px;
            padding: 22px;
            background: #f8f6fc;
            border-left: 4px solid #7653b5;
            border-radius: 10px;
            line-height: 1.7;
        }

        .answer-box h3 {
            color: #6545a5;
            margin-top: 0;
        }

        .error {
            color: #c0392b;
        }

        .details {
            color: #777;
            font-size: 13px;
            margin-top: 15px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>AI Knowledge Assistant</h1>
            <p>Ask questions and get intelligent answers from your knowledge base.</p>
        </div>

        <div class="chat-box">

            <h3>Ask a Question</h3>

            <textarea
                id="question"
                placeholder="For example: What is ISO 10007?"
            ></textarea>

            <button id="askButton" onclick="askQuestion()">
                Ask Question
            </button>

            <div class="answer-box" id="answerBox">
                <h3>AI Answer</h3>
                <div id="answer"></div>
                <div class="details" id="details"></div>
            </div>

        </div>

        <div class="footer">
            Powered by Retrieval-Augmented Generation (RAG)
        </div>

    </div>

    <script>
        async function askQuestion() {
            const question = document.getElementById("question").value.trim();
            const button = document.getElementById("askButton");
            const answerBox = document.getElementById("answerBox");
            const answer = document.getElementById("answer");
            const details = document.getElementById("details");

            if (!question) {
                alert("Please enter a question.");
                return;
            }

            button.disabled = true;
            button.textContent = "Generating Answer...";
            answerBox.style.display = "block";
            answer.textContent = "Please wait while the AI processes your question...";
            details.textContent = "";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Something went wrong.");
                }

                answer.textContent = data.answer;

                details.textContent =
                    "Retrieval: " + data.retrieval_time.toFixed(3) +
                    "s | Generation: " + data.generation_time.toFixed(3) +
                    "s | Total: " + data.total_time.toFixed(3) + "s";

            } catch (error) {
                answer.textContent = error.message;
                answer.classList.add("error");
            } finally {
                button.disabled = false;
                button.textContent = "Ask Question";
            }
        }
    </script>

</body>
</html>
